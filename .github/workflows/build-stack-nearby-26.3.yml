name: Build Stack to Nearby Chests 26.3

on:
  push:
    branches:
      - stack-nearby-26.3-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build host
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone upstream
        run: |
          git clone --depth=1 --branch master https://github.com/xiaocihua/stack-to-nearby-chests.git upstream

      - name: Port build metadata to Minecraft 26.3
        run: |
          cd upstream
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/libs.versions.toml")
          s = p.read_text()
          replacements = {
              'minecraft = "26.2"': 'minecraft = "26.3"',
              'loader = "0.19.3"': 'loader = "0.19.5"',
              'api = "0.158.0+26.2"': 'api = "0.161.0+26.3"',
              'libGui = "17.0.0+26.2"': 'libGui = "18.0.1+26.3-rc-2"',
              'modmenu = "20.0.1"': 'modmenu = "21.0.0-beta.1"',
          }
          for old, new in replacements.items():
              if old not in s:
                  print(f"WARNING: version line not found: {old}")
              s = s.replace(old, new)
          p.write_text(s)

          p = Path("gradle.properties")
          s = p.read_text().replace("version=0.5.16", "version=0.5.16+26.3")
          p.write_text(s)

          p = Path("src/main/resources/fabric.mod.json")
          s = p.read_text().replace('"minecraft": ">=26.2"', '"minecraft": ">=26.3"')
          p.write_text(s)

          # Minecraft 26.3 migrated input handling from GLFW to SDL3.
          for p in Path("src/main/java").rglob("*.java"):
              s = p.read_text()
              s = s.replace("import org.lwjgl.glfw.GLFW;", "import org.lwjgl.sdl.SDLMouse;\nimport org.lwjgl.sdl.SDLScancode;")
              replacements = {
                  "GLFW.GLFW_KEY_LEFT_ALT": "SDLScancode.SDL_SCANCODE_LALT",
                  "GLFW.GLFW_KEY_LEFT_CONTROL": "SDLScancode.SDL_SCANCODE_LCTRL",
                  "GLFW.GLFW_KEY_S": "SDLScancode.SDL_SCANCODE_S",
                  "GLFW.GLFW_KEY_C": "SDLScancode.SDL_SCANCODE_C",
                  "GLFW.GLFW_KEY_ESCAPE": "SDLScancode.SDL_SCANCODE_ESCAPE",
                  "GLFW.GLFW_KEY_ENTER": "SDLScancode.SDL_SCANCODE_RETURN",
                  "GLFW.GLFW_KEY_BACKSPACE": "SDLScancode.SDL_SCANCODE_BACKSPACE",
                  "GLFW.GLFW_MOUSE_BUTTON_2": "SDLMouse.SDL_BUTTON_RIGHT",
                  "GLFW.GLFW_MOUSE_BUTTON_LEFT": "SDLMouse.SDL_BUTTON_LEFT",
                  "InputConstants.Type.KEYSYM": "InputConstants.Type.KEYBOARD",
                  "InputConstants.isKeyDown(window, key)": "InputConstants.isKeyDown(key)",
              }
              for a, b in replacements.items():
                  s = s.replace(a, b)
              s = s.replace(
                  "SDLMouse.glfwGetMouseButton(window.handle(), key + MOUSE_BUTTON_CODE_OFFSET) == SDLMouse.GLFW_PRESS",
                  "(SDLMouse.SDL_GetMouseState(null, null) & (1 << (key + MOUSE_BUTTON_CODE_OFFSET - 1))) != 0"
              )
              # The previous replacement above cannot catch the original static call after import conversion.
              s = s.replace(
                  "GLFW.glfwGetMouseButton(window.handle(), key + MOUSE_BUTTON_CODE_OFFSET) == GLFW.GLFW_PRESS",
                  "(SDLMouse.SDL_GetMouseState(null, null) & (1 << (key + MOUSE_BUTTON_CODE_OFFSET - 1))) != 0"
              )
              p.write_text(s)

          # 26.3 moved dropping the selected hotbar item from LocalPlayer.drop(boolean)
          # to MultiPlayerGameMode.dropItem(LocalPlayer, boolean). Move the favorite-slot
          # protection mixin to the new method and stop loading the obsolete LocalPlayer mixin.
          p = Path("src/main/resources/stacktonearbychests.mixins.json")
          mixins = p.read_text().replace('    "LocalPlayerMixin",\n', '')
          p.write_text(mixins)

          p = Path("src/main/java/io/github/xiaocihua/stacktonearbychests/mixin/MultiPlayerGameModeMixin.java")
          code = p.read_text()
          code = code.replace(
              "import net.minecraft.client.multiplayer.MultiPlayerGameMode;\n",
              "import net.minecraft.client.multiplayer.MultiPlayerGameMode;\nimport net.minecraft.client.player.LocalPlayer;\n"
          )
          marker = "\n}\n"
          injection = (
              "\n    @Inject(method = \"dropItem(Lnet/minecraft/client/player/LocalPlayer;Z)V\", at = @At(\"HEAD\"), cancellable = true)\n"
              "    private void beforeDropSelectedItem(LocalPlayer player, boolean all, CallbackInfo ci) {\n"
              "        int selectedSlot = player.getInventory().getSelectedSlot();\n"
              "        if (LockedSlots.beforeDropSelectedItem(selectedSlot) == InteractionResult.FAIL) {\n"
              "            ci.cancel();\n"
              "        }\n"
              "    }\n\n"
              "    @Inject(method = \"dropItem(Lnet/minecraft/client/player/LocalPlayer;Z)V\", at = @At(\"TAIL\"))\n"
              "    private void afterDropSelectedItem(LocalPlayer player, boolean all, CallbackInfo ci) {\n"
              "        LockedSlots.afterDropSelectedItem(player.getInventory().getSelectedSlot());\n"
              "    }\n"
          )
          if "beforeDropSelectedItem(LocalPlayer player" not in code:
              code = code.rsplit(marker, 1)[0] + "\n" + injection + marker
          p.write_text(code)
          PY

      - name: Build
        working-directory: upstream
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: stack-to-nearby-chests-26.3
          path: upstream/build/libs/*.jar
          if-no-files-found: error
